<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso al Sistema de Triage</title>
    <!-- Bootstrap desde CDN para que se vea profesional -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">
            Sistema de Triage Hospitalario
        </span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-4 text-center">
                        Ingreso al sistema
                    </h3>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                            >
                        </div>

                        <div class="mb-3 small text-muted">
                            Para la demo podés usar:<br>
                            <strong>enfermeria_demo</strong>, <strong>medico_demo</strong>,
                            <strong>directivo_demo</strong><br>
                            Contraseña: <strong>1234</strong>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Ingresar
                            </button>
                        </div>
                    </form>

                </div>
            </div>

            <p class="text-center text-muted mt-3 small">
                Versión demo – Trabajo Final Infraestructura IA
            </p>
        </div>
    </div>
</div>

</body>
</html>
